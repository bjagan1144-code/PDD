name: BioPatch AI - Mobile Automation (Appium)

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - 'tests/appium/**'
      - '.github/workflows/mobile-tests.yml'
  workflow_dispatch:

jobs:
  appium-mobile-tests:
    name: Appium Android UiAutomator2 Automation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Appium and UiAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Install Python Test Dependencies
        run: |
          pip install Appium-Python-Client selenium httpx openpyxl

      - name: Verify Android Device & Emulator Availability
        id: check-device
        run: |
          echo "Checking connected Android hardware or active virtual device..."
          DEVICES=$(adb devices | grep -w "device" | awk '{print $1}')
          if [ -z "$DEVICES" ]; then
            echo "STATUS=BLOCKED" >> $GITHUB_ENV
            echo "No Android device or emulator currently attached to runner."
          else
            echo "STATUS=READY" >> $GITHUB_ENV
            echo "Target Device: $DEVICES"
          fi

      - name: Execute Appium Automation Suite
        run: |
          if [ "$STATUS" = "BLOCKED" ]; then
            echo "[BLOCKED] Marking mobile execution BLOCKED due to missing physical device/emulator in standard runner."
            python tests/appium/run_appium_tests.py || true
          else
            appium --port 4723 --address 127.0.0.1 &
            sleep 5
            python tests/appium/run_appium_tests.py
          fi

      - name: Upload Appium Reports & Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-reports
          path: tests/performance/reports/BioPatch_Appium_*

