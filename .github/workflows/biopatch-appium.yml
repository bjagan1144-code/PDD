name: BioPatch AI Appium Mobile Automation Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  appium-mobile-tests:
    name: Execute Appium Flutter Android Mobile E2E Automation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Appium & Python Dependencies
        run: |
          npm install -g appium
          appium driver install uiautomator2
          pip install Appium-Python-Client openpyxl httpx pandas pyyaml

      - name: Install Flutter & Backend Dependencies
        run: |
          cd mobile
          flutter pub get
          cd ../backend
          pip install -r requirements.txt

      - name: Build BioPatch Flutter Android Debug APK
        run: |
          cd mobile
          flutter build apk --debug

      - name: Start FastAPI Backend Service
        run: |
          cd backend
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          echo "FastAPI backend started for mobile API integration."

      - name: Run Appium Android Emulator Automation Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          script: |
            echo "Starting Appium server..."
            nohup appium --port 4723 > appium.log 2>&1 &
            sleep 5
            
            echo "Installing BioPatch Android APK..."
            adb install mobile/build/app/outputs/flutter-apk/app-debug.apk
            
            echo "Executing Appium mobile test suite..."
            python tests/appium/run_appium_tests.py

      - name: Upload Appium Test Reports Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BioPatch_Appium_Test_Reports
          path: |
            tests/performance/reports/BioPatch_Appium_Test_Report.xlsx
            tests/performance/reports/BioPatch_Appium_Test_Report.html
            tests/performance/reports/BioPatch_Appium_Test_Summary.json
          retention-days: 30
