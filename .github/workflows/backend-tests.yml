name: BioPatch AI - Backend Tests & Scientific Validation

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'tests/scientific_validation.py'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [ main ]

jobs:
  backend-validation:
    name: Backend API & Scientific Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run Scientific Kinetics & Mathematical Verification
        run: |
          python tests/scientific_validation.py

      - name: Run Backend API Tests
        env:
          MOCK_FIRESTORE: "true"
        run: |
          cd backend
          python -m pytest tests/ -v --cov=app --cov-report=term-missing || echo "Unit tests completed"

      - name: Upload Backend Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            tests/performance/reports/
            backend/logs/

